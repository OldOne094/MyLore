name: Release

# MISSION-099 — Release pipeline. Pushing a `v*` tag builds signed installers
# for all three desktop platforms and attaches them to a GitHub Release.
#
# Signing (optional until certificates are provisioned):
#   - Windows: set `windowsCertificateThumbprint` / `certificateSubjectName` in
#     tauri.conf.json bundle.windows and provide the PFX via the
#     `WINDOWS_PFX` + `WINDOWS_PFX_PASSWORD` secrets (imported here before the
#     build).
#   - macOS: provide `APPLE_CERTIFICATE` (+ password) secrets; tauri imports
#     them automatically when APPLE_SIGNING_IDENTITY resolves.
# Without those secrets the artifacts build unsigned — fine for alpha/beta.

on:
  push:
    tags:
      - "v*"

# The default GITHUB_TOKEN is read-only; creating the draft release needs
# contents:write (first run failed with "Resource not accessible by
# integration" after Linux had already built its bundles).
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: ""
          # MSI/WiX rejects non-numeric pre-release segments (alpha.1), so
          # Windows ships NSIS-only until a stable tag.
          - platform: windows-latest
            args: "--bundles nsis"
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies (Tauri)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev
          sudo apt-get install -y libappindicator3-dev \
            || sudo apt-get install -y libayatana-appindicator3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Version sync gate
        run: node scripts/release.mjs check

      # Signing is secrets-gated: with no certificates provisioned, macOS falls
      # back to ad-hoc signing (identity "-") which bundles fine; Windows NSIS
      # needs no signing at all. When real certs land as secrets, swap "-" for
      # the real identity and add APPLE_CERTIFICATE / WINDOWS_PFX here.
      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_SIGNING_IDENTITY || '-' }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: "MyLore ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md for the changes in this release."
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
