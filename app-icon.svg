<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8a4a1f"/>
      <stop offset="1" stop-color="#b4541f"/>
    </linearGradient>
    <linearGradient id="page" x1="256" y1="140" x2="256" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffaf5"/>
      <stop offset="1" stop-color="#f5e6d8"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="330" y1="120" x2="330" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8956a"/>
      <stop offset="1" stop-color="#d4763a"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Open book: left page -->
  <path d="M 108 160
           C 150 138, 210 132, 248 152
           L 248 372
           C 210 352, 150 358, 108 380
           Z"
        fill="url(#page)"/>

  <!-- Open book: right page (slightly offset for depth) -->
  <path d="M 404 160
           C 362 138, 302 132, 264 152
           L 264 372
           C 302 352, 362 358, 404 380
           Z"
        fill="#f9ede2"/>

  <!-- Book spine shadow -->
  <line x1="256" y1="152" x2="256" y2="372" stroke="#c4956b" stroke-width="3" opacity="0.35"/>

  <!-- Page lines: left page -->
  <g stroke="#c4a882" stroke-width="5" stroke-linecap="round" opacity="0.55">
    <line x1="136" y1="192" x2="226" y2="180"/>
    <line x1="136" y1="222" x2="226" y2="210"/>
    <line x1="136" y1="252" x2="226" y2="240"/>
    <line x1="136" y1="282" x2="200" y2="272"/>
  </g>

  <!-- Page lines: right page -->
  <g stroke="#c4a882" stroke-width="5" stroke-linecap="round" opacity="0.45">
    <line x1="286" y1="180" x2="376" y2="192"/>
    <line x1="286" y1="210" x2="376" y2="222"/>
    <line x1="286" y1="240" x2="376" y2="252"/>
    <line x1="312" y1="270" x2="376" y2="280"/>
  </g>

  <!-- Bookmark ribbon: right side of right page -->
  <path d="M 316 148
           L 344 148
           L 344 252
           L 330 234
           L 316 252
           Z"
        fill="url(#ribbon)"
        stroke="#b4541f"
        stroke-width="2.5"
        stroke-linejoin="round"/>

  <!-- Subtle bottom glow / ground shadow -->
  <ellipse cx="256" cy="396" rx="170" ry="14" fill="#7a3a15" opacity="0.2"/>
</svg>
