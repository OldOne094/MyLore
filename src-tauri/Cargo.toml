[package]
name = "mylore"
version = "0.1.1-alpha.4"
description = "MyLore — local-first, offline-first, private media tracker"
authors = ["MyLore Contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mylore_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate"] }
# MISSION-112: activated only via the db-encryption feature above - feature
# unification swaps sqlx's bundled sqlite3 for SQLCipher.
libsqlite3-sys = { version = "0.30", optional = true, default-features = false, features = [
    "bundled-sqlcipher-vendored-openssl",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "form", "native-tls"] }
unicode-normalization = "0.1.25"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
scraper = "0.27"
csv = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
# MISSION-115: reading-groups CRDT + E2EE, behind the `p2p` feature below.
yrs = { version = "0.27.4", optional = true }
chacha20poly1305 = { version = "0.11.0", optional = true }
getrandom = { version = "0.4.3", optional = true }
# MISSION-116: the relay transport, behind the same `p2p` feature. rustls +
# webpki roots keeps this off OpenSSL (db-encryption vendors its own).
nostr-sdk = { version = "0.45.3", optional = true, default-features = false, features = [
    "rustls-tls-webpki-roots",
] }

[features]
# MISSION-112 - opt-in at-rest encryption. Swaps the bundled SQLite for
# SQLCipher (OpenSSL vendored); requires perl+nasm+cmake to build. Off by
# default so ordinary builds and CI are untouched.
db-encryption = ["dep:libsqlite3-sys"]
# MISSION-115/116 - the reading-groups CRDT (yrs) + E2EE (XChaCha20-Poly1305)
# engine and its Nostr relay transport. Off by default: a default build stays
# dependency-light and the group code falls back to a clear "built without p2p"
# error. Enabled with `--features p2p`.
p2p = ["dep:yrs", "dep:chacha20poly1305", "dep:getrandom", "dep:nostr-sdk"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
wiremock = "0.6"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "database"
harness = false


