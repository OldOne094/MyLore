[package]
name = "mylore"
version = "0.1.0-alpha.2"
description = "MyLore — local-first, offline-first, private media tracker"
authors = ["MyLore Contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mylore_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "form", "native-tls"] }
# MISSION-129 — NovelUpdates sits behind Cloudflare, which fingerprints the TLS
# handshake; plain reqwest is rejected before an HTTP response ever arrives.
# wreq (the maintained rquest/wreq line) replays a full Chrome TLS + HTTP/2
# fingerprint via BoringSSL. Scoped to the NU transport only; disable with
# --no-default-features to build without the BoringSSL toolchain.
wreq = { version = "6.0.0-rc", optional = true, default-features = false, features = [
    "tokio-rt",
    "webpki-roots",
    "gzip",
    "brotli",
    "deflate",
    "query",
    "form",
] }
wreq-util = { version = "3.0.0-rc", optional = true, default-features = false, features = ["emulation"] }
unicode-normalization = "0.1.25"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
scraper = "0.27"
keyring = "3"
csv = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[features]
default = ["nu-impersonate"]
# Chrome-fingerprint transport for the NovelUpdates client (MISSION-129).
# Requires cmake + NASM + clang to compile the bundled BoringSSL (btls-sys).
nu-impersonate = ["dep:wreq", "dep:wreq-util"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
wiremock = "0.6"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "database"
harness = false


